events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/json;

    # Format log akses mencakup upstream target dan ID kontainer backend
    log_format upstream_logging '[$time_local] $remote_addr to: $upstream_addr status: $status (resp_time: ${upstream_response_time}s) served_by: $upstream_http_x_served_by request: "$request"';
    access_log /var/log/nginx/access.log upstream_logging;
    error_log  /var/log/nginx/error.log warn;

    # Resolver DNS internal Docker dengan cache TTL 2 detik untuk deteksi replika baru secara otomatis
    resolver 127.0.0.11 valid=2s ipv6=off;

    server {
        listen 80;
        server_name localhost;

        # Header respon untuk melacak load balancing dan backend kontainer
        add_header X-Gateway "Medis-Cloud-API-Gateway" always;
        add_header X-Served-By $upstream_http_x_served_by always;
        add_header X-Upstream-Addr $upstream_addr always;

        # Halaman Root Gateway
        location = / {
            default_type application/json;
            return 200 '{"gateway":"Sistem Informasi Medis API Gateway","status":"online","port":8080,"endpoints":["/api/pasien","/api/obat","/api/resep","/api/dokter","/api/janji-temu","/health"]}';
        }

        # Gateway Healthcheck
        location = /health {
            default_type application/json;
            return 200 '{"status":"healthy","component":"nginx-gateway","uptime":"active"}';
        }

        # 1. Routing ke Layanan Pasien & Rekam Medis (Mendukung Load Balancing Round-Robin)
        location /api/pasien {
            set $upstream_pasien "http://service-pasien:5001";
            proxy_pass $upstream_pasien;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 5s;
            proxy_read_timeout 10s;
        }

        # 2. Routing ke Layanan Apotek & Resep Farmasi
        location /api/obat {
            set $upstream_apotek "http://service-apotek:5002";
            proxy_pass $upstream_apotek;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/resep {
            set $upstream_apotek "http://service-apotek:5002";
            proxy_pass $upstream_apotek;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 3. Routing ke Layanan Jadwal Dokter & Poliklinik
        location /api/dokter {
            set $upstream_jadwal "http://service-jadwal:5003";
            proxy_pass $upstream_jadwal;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/janji-temu {
            set $upstream_jadwal "http://service-jadwal:5003";
            proxy_pass $upstream_jadwal;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}

